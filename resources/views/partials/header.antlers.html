                <li>
                    <a href="/" class="block py-2 px-3 text-lg hover:text-greenheading font-semibold text-navColor"
                        aria-current="page">Home</a>

                    <a href="/about" class="block py-2 px-3 text-lg hover:text-greenheading font-semibold text-navColor">About Us</a>

                <li>
                    <a href="/techsolutions" class="block py-2 px-3 text-lg hover:text-greenheading font-semibold text-navColor">Tech Solutions</a>
                </li>
                <li class="relative">
                    <button id="dropdownNavbarLink" data-dropdown-toggle="dropdownNavbar-1"
                        class="flex items-center justify-between w-full py-2 px-3 text-lg hover:text-greenheading font-semibold text-navColor">
                        <a href="/servicesector" class="block hover:text-greenheading font-semibold">Service Sector</a>
                        <svg class="w-2.5 h-2.5 ms-2.5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"
                            fill="none" viewBox="0 0 10 6">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m1 1 4 4 4-4" />
                        </svg>
                    </button>
                    <div id="dropdownNavbar-1"
                        class="z-10 hidden absolute top-full left-0 md:mt-0 font-normal bg-white divide-y divide-gray-100 rounded-lg shadow w-48">

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const currentPath = window.location.pathname;
        const navLinks = document.querySelectorAll('#navbar-dropdown a');

        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPath || (href === '/' && currentPath === '')) {
                link.classList.remove('text-navColor');
                link.classList.add('text-greenheading');
            }
        });

        // Handle Service Sector dropdown active state
        const serviceSectorButton = document.querySelector('#dropdownNavbarLink');
        if (currentPath === '/servicesector') {
            serviceSectorButton?.classList.remove('text-navColor');
            serviceSectorButton?.classList.add('text-greenheading');
        }

        // --- NEW: Mobile Menu Toggle Logic ---
        const toggleButton = document.querySelector('[data-collapse-toggle="navbar-dropdown"]');
        const menu = document.getElementById('navbar-dropdown');

        if (toggleButton && menu) {
            toggleButton.addEventListener('click', () => {
                menu.classList.toggle('hidden');
                const isExpanded = toggleButton.getAttribute('aria-expanded') === 'true';
                toggleButton.setAttribute('aria-expanded', !isExpanded);
            });
        }

        // --- NEW: Dropdown Toggle Logic ---
        const dropdownButton = document.querySelector('[data-dropdown-toggle="dropdownNavbar-1"]');
        const dropdownMenu = document.getElementById('dropdownNavbar-1');

        if (dropdownButton && dropdownMenu) {
            dropdownButton.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownMenu.classList.toggle('hidden');
            });

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!dropdownButton.contains(e.target) && !dropdownMenu.contains(e.target)) {
                    dropdownMenu.classList.add('hidden');
                }
            });
        }
    });
</script>
