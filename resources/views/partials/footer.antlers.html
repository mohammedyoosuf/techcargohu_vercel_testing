<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="assets/js/owl.carousel.min.js"></script>
<script>
    jQuery(document).ready(function($) {
        $('.owl-carousel').owlCarousel({
            loop: true,
            margin: 10,
            nav: true,
            dots: false,
            navText: [
                `<img src="https://techcargohub.com/assets/images/greenarrow.png" alt="greenArrow" class="w-5 h-auto" style="transform: scaleX(-1);" />`,
                `<img src="https://techcargohub.com/assets/images/greenarrow.png" alt="greenArrow" class="w-5 h-auto" />`
            ],
            autoplay: true,
            responsive: {
                0: {
                    items: 1
                },
                600: {
                    items: 2
                },
                1000: {
                    items: 4
                }
            }
        });
    });


    document.addEventListener('DOMContentLoaded', function() {
const urlParams = new URLSearchParams(window.location.search);

const scrollTargets = {
    'scroll': {selector: '#contact-form', offset: 80},
    'gscroll': {selector: '#general-cargo', offset: 100},
    'pscroll': {selector: '#pharmaceutical', offset: 100},
    'fcmgscroll': {selector: '#fcmg', offset: 100},
    'cscroll': {selector: '#consumer-electronics', offset: 100}
};

Object.keys(scrollTargets).forEach(param => {
    if (urlParams.get(param) === 'true') {
        const {selector, offset} = scrollTargets[param];
        const target = document.querySelector(selector);
        if (target) {
            setTimeout(() => {
                window.scrollTo({
                    top: target.offsetTop - offset,
                    behavior: 'smooth'
                });
            }, 70);
        }
    }
});
});


</script>
