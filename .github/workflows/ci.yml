name: CI – Build & Check

on:
  push:
    branches:
      - main
      - yoosuf
  pull_request:
    branches:
      - main
      - yoosuf

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: laravel_test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ── 1. Checkout code ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up PHP 8.2 ────────────────────────────────────────────
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql, gd, xml, zip, curl
          coverage: none

      # ── 3. Validate composer.json ────────────────────────────────────
      - name: Validate composer.json
        run: composer validate

      # ── 4. Cache Composer packages ───────────────────────────────────
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # ── 5. Install PHP dependencies ──────────────────────────────────
      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # ── 6. Set up Node.js ────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 7. Install Node dependencies ─────────────────────────────────
      - name: Install NPM dependencies
        run: npm ci

      # ── 8. Build Vite assets ─────────────────────────────────────────
      - name: Build frontend assets (Vite)
        run: npm run build

      # ── 9. Set up Laravel .env ───────────────────────────────────────
      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Set environment for CI
        run: |
          sed -i 's/APP_ENV=local/APP_ENV=testing/' .env
          sed -i 's/APP_DEBUG=true/APP_DEBUG=true/' .env
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=laravel/DB_DATABASE=laravel_test/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=secret/' .env

      # ── 10. Generate application key ──────────────────────────────────
      - name: Generate APP_KEY
        run: php artisan key:generate

      # ── 11. Run database migrations ───────────────────────────────────
      - name: Run database migrations
        run: php artisan migrate --force

      # ── 12. Clear and cache config ────────────────────────────────────
      - name: Cache Laravel config
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      # ── 13. Run PHP syntax check on all app files ─────────────────────
      - name: PHP syntax check
        run: find app config routes -name "*.php" | xargs php -l

      # ── 14. Run PHPUnit tests (if any) ───────────────────────────────
      - name: Run PHPUnit tests
        run: php artisan test --env=testing
        continue-on-error: true   # Won't fail the build if no tests exist yet
